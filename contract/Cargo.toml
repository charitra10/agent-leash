[package]
name = "agent-leash"
description = "A spending-policy wallet for AI agents on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
anyhow = "1.0.104"
near-sdk = { version = "5", features = ["unit-testing"] }
near-workspaces = "0.24.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
